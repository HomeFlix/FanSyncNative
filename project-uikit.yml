name: FanSyncNativeUIKit
options:
  bundleIdPrefix: com.fansyncnative
  deploymentTarget:
    iOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  Starscream:
    url: https://github.com/daltoniam/Starscream.git
    from: 4.0.6
targets:
  FanSyncNativeUIKit:
    type: application
    platform: iOS
    sources:
      - path: FanSyncNativeUIKit
    dependencies:
      - package: Starscream
    info:
      path: FanSyncNativeUIKit/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: FanSync
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fansyncnative.uikit
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
