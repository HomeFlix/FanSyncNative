name: FanSyncNativeUIKit
options:
  bundleIdPrefix: com.fansyncnative
  deploymentTarget:
    iOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  Starscream:
    url: https://github.com/daltoniam/Starscream.git
    from: 4.0.6
targets:
  FanSyncNativeUIKit:
    type: application
    platform: iOS
    sources:
      - path: FanSyncNativeUIKit
    dependencies:
      - package: Starscream
    info:
      path: FanSyncNativeUIKit/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        CFBundleDisplayName: fanSync WiFi
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fansyncnative.uikit
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # UILaunchScreen/INFOPLIST_KEY_UILaunchScreen_Generation is an iOS 13+
        # mechanism. On iOS 12 it does nothing, and WITHOUT a real launch
        # screen (UILaunchStoryboardName, set above) the OS silently falls
        # back to legacy compatibility mode — rendering the whole app in a
        # fixed 320x480 (iPhone 4-era) point coordinate space regardless of
        # the real device's screen size. Confirmed via a device console log
        # on an iPhone 6 (view.bounds reported as 320x480 instead of the
        # real 375x667), which was the actual root cause of a keyboard-
        # covers-the-login-fields bug that looked at first like a scroll
        # view/keyboard-avoidance bug. Do not reintroduce UILaunchScreen: {}
        # as the launch mechanism for this iOS-12-targeting app.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM intentionally left unset here — it's tied to
        # whichever personal Apple ID is signed into Xcode's Accounts on
        # the machine building this, and must be picked once from the
        # Signing & Capabilities "Team" dropdown in Xcode's GUI.
