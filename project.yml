name: FanSyncNative
options:
  bundleIdPrefix: com.fansyncnative
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  FanSyncNative:
    type: application
    platform: iOS
    sources:
      - path: FanSyncNative
    info:
      path: FanSyncNative/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: FanSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fansyncnative.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
